[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-health"
dynamic = ["version"]
description = "Local LLM health monitor and GGUF model explorer (desktop app)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Corentin Ravoux", email = "corentin.ravoux.research@gmail.com"},
]
keywords = ["llm", "llama.cpp", "gguf", "gpu", "monitoring"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "psutil",
    "nvidia-ml-py",
    "gguf",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]
desktop = ["pywebview>=5"]

[project.scripts]
ai-health = "ai_health.app:main"

[project.urls]
Homepage = "https://github.com/corentinravoux/ai-health"
Repository = "https://github.com/corentinravoux/ai-health"
Issues = "https://github.com/corentinravoux/ai-health/issues"

[tool.setuptools.dynamic]
version = {attr = "ai_health.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_health*"]

[tool.setuptools.package-data]
ai_health = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "ai_health/__init__.py"
