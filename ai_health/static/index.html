<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ai-health</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="vendor/uplot/uPlot.min.css">
  <link rel="stylesheet" href="css/monitor.css">
  <link rel="stylesheet" href="css/explorer.css">
</head>
<body data-mode="monitor">
  <nav class="rail" aria-label="Modes">
    <div class="mark" title="ai-health">
      <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="6" y="6" width="24" height="24" rx="5" stroke-opacity=".45"/>
        <path d="M2 19h7l3-7 5 12 4-9 2.5 4H34"/>
      </svg>
    </div>
    <button class="rail-btn" data-mode-btn="monitor" title="Monitor (1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="14" rx="2.5"/><path d="M6 13h3l2-4 2.5 6 2-3H18"/><path d="M9 21h6"/>
      </svg>
      Monitor
    </button>
    <button class="rail-btn" data-mode-btn="explorer" title="Explorer (2)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="7" y="2.5" width="10" height="4" rx="1.5"/><rect x="5" y="10" width="14" height="4" rx="1.5"/><rect x="7" y="17.5" width="10" height="4" rx="1.5"/><path d="M12 6.5V10M12 14v3.5"/>
      </svg>
      Explorer
    </button>
    <div class="rail-spacer"></div>
    <div class="conn" id="conn" data-state="connecting"><span class="conn-dot"></span><span class="conn-label">Connecting</span></div>
    <button class="rail-btn" id="theme-btn" title="Switch light / dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
      </svg>
      Theme
    </button>
  </nav>
  <main>
    <section class="mode" id="monitor" aria-label="Live monitor"></section>
    <section class="mode" id="explorer" aria-label="Model explorer" hidden></section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="vendor/uplot/uPlot.iife.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
